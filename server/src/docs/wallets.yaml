paths:
  /wallet:
    get:
      tags: [Wallet]
      summary: The user's wallet balances (Main / Bonus / Trading + totals)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Wallet balances
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      wallets:
                        type: object
                        properties:
                          main: { type: object, description: "{ available, onHold }" }
                          bonus: { type: object, description: "{ available, onHold }" }
                          trading: { type: object, description: "{ available, onHold }" }
                          totalAvailable: { type: number }
                          totalOnHold: { type: number }
                          total: { type: number }
        "401": { description: Unauthorized }

  /wallet/ledger:
    get:
      tags: [Wallet]
      summary: Paginated, filterable wallet transaction history (newest first)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: wallet
          schema: { type: string, enum: [main, bonus, trading] }
        - in: query
          name: type
          schema: { type: string }
          description: Ledger entry type (deposit, trading_yield, direct_bonus, ...)
        - in: query
          name: q
          schema: { type: string, maxLength: 60 }
          description: Case-insensitive memo substring search
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: A page of immutable ledger rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      ledger:
                        type: object
                        properties:
                          items: { type: array, items: { type: object } }
                          page: { type: integer }
                          limit: { type: integer }
                          total: { type: integer }
                          totalPages: { type: integer }
        "401": { description: Unauthorized }