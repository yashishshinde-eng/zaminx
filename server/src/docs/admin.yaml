paths:
  /admin/dashboard:
    get:
      tags: [Admin]
      summary: Platform-wide admin dashboard
      description: >
        Phase 14A. Headline KPIs (total users + by status, paid deposit volume,
        paid withdrawal volume + by-status breakdown, AUM = all wallet
        available+onHold, active packages, sponsors), a 30-day daily
        deposits-vs-withdrawals series, and the 10 most recent audit-log
        entries. Admin is authorised to see PII. Requires the `admin` role.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Admin dashboard payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      dashboard:
                        type: object
                        properties:
                          kpis:
                            type: object
                            properties:
                              totalUsers: { type: integer }
                              byStatus:
                                type: object
                                properties:
                                  active: { type: integer }
                                  suspended: { type: integer }
                                  banned: { type: integer }
                              totalDeposits:
                                type: object
                                properties:
                                  count: { type: integer }
                                  sumUsd: { type: number }
                              totalWithdrawals:
                                type: object
                                properties:
                                  count: { type: integer }
                                  sumUsd: { type: number }
                                  byStatus: { type: object, additionalProperties: { type: integer } }
                              aum: { type: number }
                              activePackages: { type: integer }
                              sponsors: { type: integer }
                          series:
                            type: array
                            items:
                              type: object
                              properties:
                                date: { type: string }
                                deposits: { type: number }
                                withdrawals: { type: number }
                          recentActivity:
                            type: array
                            items:
                              type: object
                              properties:
                                id: { type: string }
                                actorName: { type: string, nullable: true }
                                action: { type: string }
                                createdAt: { type: string }
        "401": { description: Unauthorized }
        "403": { description: Forbidden (non-admin) }

  /admin/users:
    get:
      tags: [Admin, Users]
      summary: Admin user list (paginated, searchable, filterable)
      description: >
        Phase 14A. Paginated list of users joined with direct-referral count
        and wallet balances (the same joined row shape as the admin "users"
        report). Admin is authorised to see PII. Requires the `admin` role.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: q
          schema: { type: string, maxLength: 60, description: "name / email / referralCode search" }
        - in: query
          name: status
          schema: { type: string, enum: [active, suspended, banned] }
        - in: query
          name: role
          schema: { type: string, enum: [user, admin] }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: A page of admin user rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      users:
                        type: object
                        properties:
                          items: { type: array, items: { type: object } }
                          page: { type: integer }
                          limit: { type: integer }
                          total: { type: integer }
                          totalPages: { type: integer }
        "401": { description: Unauthorized }
        "403": { description: Forbidden (non-admin) }

  /admin/users/{id}:
    get:
      tags: [Admin, Users]
      summary: Admin user detail
      description: >
        Phase 14A. Full admin view of a single user — profile, wallet balances,
        active package, direct-referral count, and recent activity. Requires
        the `admin` role.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Admin user detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      user: { type: object }
        "401": { description: Unauthorized }
        "403": { description: Forbidden (non-admin) }
        "404": { description: User not found }

  /admin/users/{id}/status:
    patch:
      tags: [Admin, Users]
      summary: Suspend / ban / activate a user
      description: >
        Phase 14A. Flips the user's status. A non-active user's refresh token
        is invalidated (forced logout). An admin cannot change their own
        status. Requires the `admin` role.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, suspended, banned] }
      responses:
        "200": { description: User status updated }
        "400": { description: Validation failed }
        "401": { description: Unauthorized }
        "403": { description: Forbidden (non-admin) }
        "404": { description: User not found }
        "409": { description: Cannot change own status }

  /admin/users/{id}/verify-email:
    post:
      tags: [Admin, Users]
      summary: Manually mark a user's email verified
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Email verified }
        "401": { description: Unauthorized }
        "403": { description: Forbidden (non-admin) }
        "404": { description: User not found }

  /admin/users/{id}/force-logout:
    post:
      tags: [Admin, Users]
      summary: Invalidate a user's refresh token (force logout)
      description: An admin cannot force-logout themselves.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: User logged out }
        "401": { description: Unauthorized }
        "403": { description: Forbidden (non-admin) }
        "404": { description: User not found }
        "409": { description: Cannot force-logout yourself }

  /admin/users/{id}/reset-password:
    post:
      tags: [Admin, Users]
      summary: Admin sets a new password for a user
      description: >
        Rehashes the new password and clears any pending reset token. The
        user's refresh token is also invalidated (forced re-login everywhere).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "200": { description: Password reset }
        "400": { description: Validation failed }
        "401": { description: Unauthorized }
        "403": { description: Forbidden (non-admin) }
        "404": { description: User not found }

  /admin/settings/compensation:
    get:
      tags: [Admin, Compensation]
      summary: Read the 7 compensation knobs
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Compensation settings snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      compensation:
                        type: object
                        properties:
                          directBonusPct: { type: number }
                          yieldEnabled: { type: boolean }
                          teamEnergyEnabled: { type: boolean }
                          teamEnergyDepth: { type: integer }
                          teamEnergyPct: { type: array, items: { type: number } }
                          communityEnabled: { type: boolean }
                          communityPct: { type: number }
        "401": { description: Unauthorized }
        "403": { description: Forbidden (non-admin) }
    patch:
      tags: [Admin, Compensation]
      summary: Update the provided compensation knobs
      description: Only provided fields are written; the rest stay unchanged.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                directBonusPct: { type: number, minimum: 0, maximum: 100 }
                yieldEnabled: { type: boolean }
                teamEnergyEnabled: { type: boolean }
                teamEnergyDepth: { type: integer, minimum: 0, maximum: 10 }
                teamEnergyPct: { type: array, items: { type: number, minimum: 0, maximum: 100 }, maxItems: 10 }
                communityEnabled: { type: boolean }
                communityPct: { type: number, minimum: 0, maximum: 100 }
      responses:
        "200":
          description: Updated compensation settings snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      compensation: { type: object }
        "400": { description: Validation failed }
        "401": { description: Unauthorized }
        "403": { description: Forbidden (non-admin) }