paths:
  /dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Aggregated user dashboard (wallets, package, rank, income, activity)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      account: { type: object }
                      referral: { type: object }
                      wallets: { type: object }
                      package: { type: object }
                      income: { type: object }
                      notifications: { type: object }
                      recentActivity: { type: array, items: { type: object } }
        "401": { description: Unauthorized }