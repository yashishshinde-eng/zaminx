paths:
  /packages:
    get:
      tags: [Packages]
      summary: Active package catalog (investment tiers)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Catalog of active tiers, ordered by sort then price
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      packages:
                        type: array
                        items: { type: object }
        "401": { description: Unauthorized }

  /packages/mine:
    get:
      tags: [Packages]
      summary: The user's package subscriptions (activation history & status)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The user's subscriptions, most recent first
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      packages:
                        type: array
                        items: { type: object }
        "401": { description: Unauthorized }

  /packages/activate:
    post:
      tags: [Packages]
      summary: Initiate a package activation (creates a pending subscription)
      description: >
        Creates a `pending` subscription awaiting payment. Phase 7 wires the
        NOWPayments invoice + webhook that confirm it to `active`. One
        pending/active subscription per user.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [packageId]
              properties:
                packageId: { type: string, description: "Mongo ObjectId of the package tier" }
      responses:
        "201":
          description: Activation started — returns the pending subscription
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      package: { type: object }
        "400": { description: Validation failed }
        "401": { description: Unauthorized }
        "404": { description: Package not found }
        "409": { description: A pending or active package already exists }